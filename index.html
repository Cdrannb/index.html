<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Daily Schedule - Room 507</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #4A90D9; --blue-light: #D6EAFF; --blue-bg: #EBF4FF;
    --green: #43A047; --green-light: #D5F5D5; --green-bg: #E8F8E8;
    --yellow: #FFA726; --yellow-light: #FFF3D6; --yellow-bg: #FFF8EC;
    --purple: #7E57C2; --pink: #EC407A;
    --dark: #2C3E50; --gray: #7F8C8D; --light-gray: #ECF0F1;
    --radius: 18px;
  }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: var(--dark);
    -webkit-user-select: none; user-select: none;
  }

  .app-container {
    max-width: 900px; margin: 0 auto; padding: 16px 12px 40px;
  }

  /* ── Header ─────────────────────────────────────── */
  .header {
    text-align: center; padding: 20px 10px 12px; color: white;
  }
  .header h1 {
    font-size: 2rem; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    line-height: 1.2;
  }
  .header .subtitle { font-size: 1rem; opacity: 0.85; margin-top: 4px; font-weight: 600; }

  /* ── Day Tabs ───────────────────────────────────── */
  .day-tabs {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin: 12px 0 16px;
  }
  .day-tab {
    padding: 10px 18px; border-radius: 30px; border: none; cursor: pointer;
    font-family: inherit; font-size: 0.95rem; font-weight: 700;
    background: rgba(255,255,255,0.2); color: white;
    transition: all 0.3s ease; backdrop-filter: blur(4px);
  }
  .day-tab:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
  .day-tab.active {
    background: white; color: var(--purple); box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transform: scale(1.05);
  }

  /* ── Schedule Cards ─────────────────────────────── */
  .schedule-container {
    background: rgba(255,255,255,0.95); border-radius: 24px;
    padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    backdrop-filter: blur(10px);
  }

  .period-card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: var(--radius); margin-bottom: 10px;
    border: 3px solid transparent; cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative; overflow: hidden;
  }
  .period-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%);
    pointer-events: none;
  }
  .period-card:active { transform: scale(0.98); }

  .period-card.type-reg { background: var(--blue-bg); border-color: var(--blue-light); }
  .period-card.type-spec { background: var(--green-bg); border-color: var(--green-light); }
  .period-card.type-lunch { background: var(--yellow-bg); border-color: var(--yellow-light); }

  .period-card.checked { opacity: 0.7; border-color: var(--green) !important; }
  .period-card.checked .card-content .activity { text-decoration: line-through; }
  .period-card.checked .check-circle { background: var(--green); border-color: var(--green); }
  .period-card.checked .check-circle::after { opacity: 1; transform: scale(1) rotate(0deg); }

  /* Check circle */
  .check-circle {
    width: 52px; height: 52px; min-width: 52px; border-radius: 50%;
    border: 3px solid #ccc; background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; transition: all 0.3s ease; position: relative;
  }
  .check-circle::after {
    content: '⭐'; position: absolute; opacity: 0;
    transform: scale(0) rotate(-180deg);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-size: 1.5rem;
  }
  .type-reg .check-circle { border-color: var(--blue); }
  .type-spec .check-circle { border-color: var(--green); }
  .type-lunch .check-circle { border-color: var(--yellow); }

  .card-emoji {
    font-size: 2rem; min-width: 40px; text-align: center;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
  }

  .card-content { flex: 1; }
  .card-content .period-time {
    font-size: 0.78rem; font-weight: 700; color: var(--gray);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .card-content .activity {
    font-size: 1.15rem; font-weight: 800; color: var(--dark); margin: 2px 0;
  }
  .card-content .location {
    font-size: 0.85rem; font-weight: 600; color: var(--purple);
    display: flex; align-items: center; gap: 4px;
  }
  .card-content .location::before { content: '📍'; font-size: 0.8rem; }
  .card-content .transition {
    font-size: 0.78rem; font-weight: 600; color: var(--gray);
    margin-top: 4px; font-style: italic;
    display: flex; align-items: center; gap: 4px;
  }
  .card-content .transition::before { content: '💡'; font-size: 0.75rem; }

  /* ── Reinforcement Tracker ──────────────────────── */
  .tracker {
    margin-top: 20px; background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: var(--radius); padding: 20px; color: white;
  }
  .tracker h2 { font-size: 1.3rem; text-align: center; margin-bottom: 14px; }

  .progress-section { text-align: center; margin-bottom: 16px; }
  .progress-bar-bg {
    width: 100%; height: 28px; background: rgba(255,255,255,0.25);
    border-radius: 14px; overflow: hidden; margin: 8px 0;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, #FFD54F, #FF9800, #F44336);
    border-radius: 14px; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
    font-size: 0.75rem; font-weight: 800; min-width: 0;
  }
  .progress-text { font-size: 1.1rem; font-weight: 800; }

  .tracker-goal {
    background: rgba(255,255,255,0.15); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; text-align: center;
    font-weight: 700; font-size: 0.95rem;
  }

  .reward-section {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    justify-content: center;
  }
  .reward-section label { font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .reward-input {
    flex: 1; max-width: 300px; padding: 8px 14px; border-radius: 10px; border: none;
    font-family: inherit; font-size: 0.95rem; font-weight: 600;
    outline: none; background: rgba(255,255,255,0.9); color: var(--dark);
  }

  .teacher-checks {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px;
  }
  .teacher-check-btn {
    padding: 8px 20px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.15); color: white; font-family: inherit;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
  }
  .teacher-check-btn.active {
    background: rgba(255,255,255,0.9); color: var(--purple);
    border-color: white;
  }

  .teacher-label { text-align: center; font-weight: 700; margin-top: 8px; font-size: 0.9rem; }

  /* ── Reset Button ───────────────────────────────── */
  .reset-btn {
    display: block; margin: 16px auto 0; padding: 12px 30px;
    border-radius: 30px; border: none; background: rgba(255,255,255,0.2);
    color: white; font-family: inherit; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(4px);
  }
  .reset-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }

  /* ── Celebration Overlay ─────────────────────────── */
  .celebration {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center;
    animation: fadeInOverlay 0.3s ease;
  }
  .celebration.show { display: flex; }
  .celebration-box {
    background: white; border-radius: 28px; padding: 40px 30px;
    text-align: center; max-width: 380px; width: 90%;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .celebration-box .big-emoji { font-size: 4rem; animation: bounce 1s infinite; }
  .celebration-box h2 { font-size: 1.6rem; color: var(--purple); margin: 12px 0 8px; }
  .celebration-box p { font-size: 1rem; color: var(--gray); font-weight: 600; }
  .celebration-close {
    margin-top: 20px; padding: 10px 30px; border-radius: 20px; border: none;
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
    font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
  }

  /* Confetti */
  .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10000; overflow: hidden; }
  .confetti-piece {
    position: absolute; width: 12px; height: 12px; top: -20px;
    animation: confettiFall 3s linear forwards;
  }

  @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ── Responsive ─────────────────────────────────── */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.5rem; }
    .day-tab { padding: 8px 13px; font-size: 0.85rem; }
    .period-card { padding: 12px; gap: 10px; }
    .card-content .activity { font-size: 1rem; }
    .check-circle { width: 44px; height: 44px; min-width: 44px; }
    .card-emoji { font-size: 1.5rem; min-width: 30px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>📅 My Daily Schedule</h1>
    <div class="subtitle">Room 507 &nbsp;•&nbsp; You've Got This! 💪</div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="schedule-container">
    <div id="periodCards"></div>

    <div class="tracker">
      <h2>⭐ Reinforcement Tracker ⭐</h2>
      <div class="progress-section">
        <div class="progress-text" id="progressText">0 / 7 Periods Done</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
      </div>
      <div class="tracker-goal">🏆 My Goal: Stay with my class for ALL transitions</div>
      <div class="reward-section">
        <label>🎁 My Reward:</label>
        <input type="text" class="reward-input" id="rewardInput" placeholder="Type your reward here...">
      </div>
      <div class="teacher-label">📝 Teacher Check-In</div>
      <div class="teacher-checks">
        <button class="teacher-check-btn" data-check="morning" onclick="toggleTeacherCheck('morning')">☐ Morning</button>
        <button class="teacher-check-btn" data-check="midday" onclick="toggleTeacherCheck('midday')">☐ Midday</button>
        <button class="teacher-check-btn" data-check="afternoon" onclick="toggleTeacherCheck('afternoon')">☐ Afternoon</button>
      </div>
    </div>
  </div>

  <button class="reset-btn" onclick="resetDay()">🔄 Reset Day</button>
</div>

<!-- Celebration overlay -->
<div class="celebration" id="celebration">
  <div class="celebration-box">
    <div class="big-emoji">🎉</div>
    <h2>AMAZING JOB!</h2>
    <p>You completed ALL your periods today! You are a SUPERSTAR! ⭐</p>
    <button class="celebration-close" onclick="closeCelebration()">Awesome! 🙌</button>
  </div>
</div>
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ── Schedule Data ────────────────────────────────────────────
const times = {
  1:"8:00 – 8:50", 2:"8:55 – 9:45", 3:"9:50 – 10:40",
  4:"10:45 – 11:35", 5:"11:40 – 12:30", 6:"12:35 – 1:25", 7:"1:30 – 2:20"
};

const schedules = {
  Monday: [
    {p:1, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:2, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:3, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:4, act:"Club", loc:"Room 507", type:"spec"},
    {p:5, act:"Lunch", loc:"Cafeteria", type:"lunch"},
    {p:6, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:7, act:"Regular Class", loc:"Room 507", type:"reg"}
  ],
  Tuesday: [
    {p:1, act:"Club (5th)", loc:"Room 507", type:"spec"},
    {p:2, act:"PE – Wetzel (4th)", loc:"Gym", type:"spec"},
    {p:3, act:"Theater (A) w/ 506", loc:"Theater Room", type:"spec"},
    {p:4, act:"Science (B) w/ 505", loc:"Science Room", type:"spec"},
    {p:5, act:"Lunch", loc:"Cafeteria", type:"lunch"},
    {p:6, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:7, act:"Regular Class", loc:"Room 507", type:"reg"}
  ],
  Wednesday: [
    {p:1, act:"PE – Cevasco (A) w/ 506", loc:"Gym", type:"spec"},
    {p:2, act:"PE – Russo (B) w/ 505", loc:"Gym", type:"spec"},
    {p:3, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:4, act:"Lunch", loc:"Cafeteria", type:"lunch"},
    {p:5, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:6, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:7, act:"Regular Class", loc:"Room 507", type:"reg"}
  ],
  Thursday: [
    {p:1, act:"ART (A) w/ 506", loc:"Art Room", type:"spec"},
    {p:2, act:"Theater (B) w/ 505", loc:"Theater Room", type:"spec"},
    {p:3, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:4, act:"Lunch", loc:"Cafeteria", type:"lunch"},
    {p:5, act:"Science (A) w/ 506", loc:"Science Room", type:"spec"},
    {p:6, act:"ART (B) w/ 505", loc:"Art Room", type:"spec"},
    {p:7, act:"Regular Class", loc:"Room 507", type:"reg"}
  ],
  Friday: [
    {p:1, act:"PE – Cevasco (A) w/ 506", loc:"Gym", type:"spec"},
    {p:2, act:"PE – Russo (B) w/ 505", loc:"Gym", type:"spec"},
    {p:3, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:4, act:"Lunch", loc:"Cafeteria", type:"lunch"},
    {p:5, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:6, act:"Regular Class", loc:"Room 507", type:"reg"},
    {p:7, act:"Regular Class", loc:"Room 507", type:"reg"}
  ]
};

function getEmoji(act, type) {
  const a = act.toLowerCase();
  if (type === "lunch") return "🍽️";
  if (a.includes("pe")) return "🏃";
  if (a.includes("art")) return "🎨";
  if (a.includes("theater")) return "🎭";
  if (a.includes("science")) return "🔬";
  if (a.includes("club")) return "🎯";
  return "📚";
}

function getTransition(period, dayData) {
  const idx = period - 1;
  const curr = dayData[idx];
  if (period === 1) return "Good morning! Head to " + curr.loc + " and get settled.";
  if (period === 7) return "Great job today! Pack up → Dismissal time! 🎒";
  const next = dayData[idx + 1];
  if (next.type === "lunch") return "Pack up your materials → Line up for lunch! 🍽️";
  if (next.loc !== curr.loc) return "Pack up → Walk quietly to " + next.loc + ".";
  return "Stay in your seat → Next class is starting soon.";
}

// ── State ────────────────────────────────────────────────────
let currentDay = "Monday";
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem("schedule507"));
    if (s && s.periods) return s;
  } catch(e) {}
  return defaultState();
}

function defaultState() {
  const s = { periods: {}, teacherChecks: {morning:false, midday:false, afternoon:false}, reward:"", currentDay:"Monday" };
  ["Monday","Tuesday","Wednesday","Thursday","Friday"].forEach(d => {
    s.periods[d] = {1:false, 2:false, 3:false, 4:false, 5:false, 6:false, 7:false};
  });
  return s;
}

function saveState() {
  state.currentDay = currentDay;
  state.reward = document.getElementById("rewardInput").value;
  localStorage.setItem("schedule507", JSON.stringify(state));
}

// ── Render ───────────────────────────────────────────────────
const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const dayEmojis = {Monday:"📘",Tuesday:"📗",Wednesday:"📙",Thursday:"📕",Friday:"📓"};

function renderTabs() {
  const container = document.getElementById("dayTabs");
  container.innerHTML = "";
  days.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "day-tab" + (d === currentDay ? " active" : "");
    btn.textContent = dayEmojis[d] + " " + d;
    btn.onclick = () => { currentDay = d; render(); saveState(); };
    container.appendChild(btn);
  });
}

function renderCards() {
  const container = document.getElementById("periodCards");
  container.innerHTML = "";
  const dayData = schedules[currentDay];

  dayData.forEach(item => {
    const checked = state.periods[currentDay][item.p];
    const card = document.createElement("div");
    card.className = "period-card type-" + item.type + (checked ? " checked" : "");
    card.onclick = () => {
      state.periods[currentDay][item.p] = !state.periods[currentDay][item.p];
      saveState(); render();
      if (getAllChecked()) celebrate();
    };

    card.innerHTML =
      '<div class="check-circle"></div>' +
      '<div class="card-emoji">' + getEmoji(item.act, item.type) + '</div>' +
      '<div class="card-content">' +
        '<div class="period-time">Period ' + item.p + ' &nbsp;•&nbsp; ' + times[item.p] + '</div>' +
        '<div class="activity">' + item.act + '</div>' +
        '<div class="location">' + item.loc + '</div>' +
        '<div class="transition">' + getTransition(item.p, dayData) + '</div>' +
      '</div>';

    container.appendChild(card);
  });
}

function updateProgress() {
  const periods = state.periods[currentDay];
  let done = 0;
  for (let i = 1; i <= 7; i++) if (periods[i]) done++;
  const pct = Math.round((done / 7) * 100);
  document.getElementById("progressText").textContent = done + " / 7 Periods Done " + (done === 7 ? "🎉" : done >= 4 ? "🔥" : "💪");
  document.getElementById("progressBar").style.width = pct + "%";
}

function getAllChecked() {
  const periods = state.periods[currentDay];
  for (let i = 1; i <= 7; i++) if (!periods[i]) return false;
  return true;
}

function renderTeacherChecks() {
  document.querySelectorAll(".teacher-check-btn").forEach(btn => {
    const key = btn.dataset.check;
    const active = state.teacherChecks[key];
    btn.className = "teacher-check-btn" + (active ? " active" : "");
    btn.textContent = (active ? "✅ " : "☐ ") + key.charAt(0).toUpperCase() + key.slice(1);
  });
}

function render() {
  renderTabs(); renderCards(); updateProgress(); renderTeacherChecks();
  document.getElementById("rewardInput").value = state.reward || "";
}

// ── Actions ──────────────────────────────────────────────────
function toggleTeacherCheck(key) {
  state.teacherChecks[key] = !state.teacherChecks[key];
  saveState(); renderTeacherChecks();
}

function resetDay() {
  for (let i = 1; i <= 7; i++) state.periods[currentDay][i] = false;
  state.teacherChecks = {morning:false, midday:false, afternoon:false};
  saveState(); render();
}

// ── Celebration ──────────────────────────────────────────────
let celebrationShown = {};
function celebrate() {
  if (celebrationShown[currentDay]) return;
  celebrationShown[currentDay] = true;
  document.getElementById("celebration").classList.add("show");
  launchConfetti();
}
function closeCelebration() {
  document.getElementById("celebration").classList.remove("show");
}

function launchConfetti() {
  const container = document.getElementById("confettiContainer");
  container.innerHTML = "";
  const colors = ["#667eea","#764ba2","#FFD54F","#FF9800","#43A047","#EC407A","#4A90D9","#F44336"];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + "s";
    piece.style.animationDuration = (2 + Math.random() * 2) + "s";
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.width = (8 + Math.random() * 8) + "px";
    piece.style.height = (8 + Math.random() * 8) + "px";
    container.appendChild(piece);
  }
  setTimeout(() => { container.innerHTML = ""; }, 5000);
}

// Save reward on input
document.getElementById("rewardInput").addEventListener("input", saveState);

// ── Auto-detect today ────────────────────────────────────────
(function init() {
  const dNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const today = dNames[new Date().getDay()];
  if (days.includes(today)) currentDay = today;
  else if (state.currentDay && days.includes(state.currentDay)) currentDay = state.currentDay;
  render();
})();
</script>
</body>
</html>
